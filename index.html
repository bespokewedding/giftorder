let ledgerCurrentPage = 1;
const LEDGER_PAGE_SIZE = 10;

function renderLedgerPage(container) {
    ledgerCurrentPage = 1;
    container.innerHTML = `
        <div class="page-title">📒 流水帳記錄管理</div>
        <div class="filter-bar">
            <input type="text" id="ledger-search" placeholder="搜尋..." oninput="ledgerCurrentPage=1; renderLedgerTable()">
            <select id="ledger-supplier-filter" onchange="ledgerCurrentPage=1; renderLedgerTable()">
                <option value="">全部供應商</option>
                ${configData.suppliers.map(s => `<option value="${s}">${s}</option>`).join('')}
            </select>
            <select id="ledger-status-filter" onchange="ledgerCurrentPage=1; renderLedgerTable()">
                <option value="">全部狀態</option>
                <option value="set">已設定</option>
                <option value="unset">未設定</option>
            </select>
            <input type="month" id="ledger-month-filter" onchange="ledgerCurrentPage=1; renderLedgerTable()" title="篩選 Report 月份">
        </div>
        <div id="ledger-table-container"></div>
    `;
    renderLedgerTable();
}

function renderLedgerTable() {
    const search = (document.getElementById('ledger-search').value || '').toLowerCase();
    const supplierFilter = document.getElementById('ledger-supplier-filter').value;
    const statusFilter = document.getElementById('ledger-status-filter').value;
    const monthFilter = document.getElementById('ledger-month-filter').value;

    let records = getVisibleRecords();

    // Filtering
    if (search) {
        records = records.filter(r =>
            (r.customerName || '').toLowerCase().includes(search) ||
            (r.supplier || '').toLowerCase().includes(search) ||
            (r.item || '').toLowerCase().includes(search) ||
            (r.productQty || '').toLowerCase().includes(search) ||
            (r.orderNumber || '').toLowerCase().includes(search)
        );
    }
    if (supplierFilter) {
        records = records.filter(r => r.supplier === supplierFilter);
    }
    if (statusFilter === 'set') {
        records = records.filter(r => r.reportMonth);
    } else if (statusFilter === 'unset') {
        records = records.filter(r => !r.reportMonth);
    }
    if (monthFilter) {
        records = records.filter(r => {
            if (!r.reportMonth) return false;
            const isoMatch = r.reportMonth.match(/(\d{4})-(\d{2})/);
            if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}` === monthFilter;
            const cnMatch = r.reportMonth.match(/(\d{4})年(\d{1,2})月/);
            if (cnMatch) return `${cnMatch[1]}-${String(cnMatch[2]).padStart(2,'0')}` === monthFilter;
            return r.reportMonth === monthFilter;
        });
    }

    // Sorting
    records.sort((a, b) => {
        let valA = a[ledgerSortField] || '';
        let valB = b[ledgerSortField] || '';
        
        if (ledgerSortField === 'timestamp' || ledgerSortField === 'deliveryDate') {
            valA = parseDate(valA) || new Date(0);
            valB = parseDate(valB) || new Date(0);
        }
        
        if (valA < valB) return ledgerSortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return ledgerSortOrder === 'asc' ? 1 : -1;
        return 0;
    });

    const tableContainer = document.getElementById('ledger-table-container');
    if (records.length === 0) {
        tableContainer.innerHTML = '<div class="card" style="text-align:center; color:#95a5a6;">沒有找到記錄</div>';
        return;
    }

    // Pagination
    const totalPages = Math.ceil(records.length / LEDGER_PAGE_SIZE);
    if (ledgerCurrentPage > totalPages) ledgerCurrentPage = totalPages;
    const startIdx = (ledgerCurrentPage - 1) * LEDGER_PAGE_SIZE;
    const pageRecords = records.slice(startIdx, startIdx + LEDGER_PAGE_SIZE);

    tableContainer.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:8px 12px; background:var(--light-bg); border-radius:6px;">
            <span style="font-size:12px; color:#7f8c8d;">共 ${records.length} 筆記錄，第 ${ledgerCurrentPage}/${totalPages} 頁</span>
            <div style="display:flex; gap:6px;">
                <button class="btn btn-sm" style="padding:4px 10px;" onclick="ledgerGoPage(1)" ${ledgerCurrentPage === 1 ? 'disabled' : ''}>«</button>
                <button class="btn btn-sm" style="padding:4px 10px;" onclick="ledgerGoPage(${ledgerCurrentPage - 1})" ${ledgerCurrentPage === 1 ? 'disabled' : ''}>‹</button>
                <button class="btn btn-sm" style="padding:4px 10px;" onclick="ledgerGoPage(${ledgerCurrentPage + 1})" ${ledgerCurrentPage >= totalPages ? 'disabled' : ''}>›</button>
                <button class="btn btn-sm" style="padding:4px 10px;" onclick="ledgerGoPage(${totalPages})" ${ledgerCurrentPage >= totalPages ? 'disabled' : ''}>»</button>
            </div>
        </div>
        <table class="data-table" style="table-layout:auto; width:100%;">
            <thead>
                <tr>
                    <th style="cursor:pointer;" onclick="setLedgerSort('timestamp')">日期 ${ledgerSortField==='timestamp'?(ledgerSortOrder==='asc'?'↑':'↓'):''}</th>
                    <th style="cursor:pointer;" onclick="setLedgerSort('supplier')">供應商 ${ledgerSortField==='supplier'?(ledgerSortOrder==='asc'?'↑':'↓'):''}</th>
                    <th style="cursor:pointer;" onclick="setLedgerSort('item')">項目 ${ledgerSortField==='item'?(ledgerSortOrder==='asc'?'↑':'↓'):''}</th>
                    <th style="cursor:pointer;" onclick="setLedgerSort('orderNumber')">訂單編號 ${ledgerSortField==='orderNumber'?(ledgerSortOrder==='asc'?'↑':'↓'):''}</th>
                    <th style="cursor:pointer;" onclick="setLedgerSort('customerName')">客人 ${ledgerSortField==='customerName'?(ledgerSortOrder==='asc'?'↑':'↓'):''}</th>
                    <th>數量</th>
                    <th style="cursor:pointer;" onclick="setLedgerSort('deliveryDate')">送貨日期 ${ledgerSortField==='deliveryDate'?(ledgerSortOrder==='asc'?'↑':'↓'):''}</th>
                    <th>送貨進度</th>
                    <th style="cursor:pointer;" onclick="setLedgerSort('reportMonth')">Report月份 ${ledgerSortField==='reportMonth'?(ledgerSortOrder==='asc'?'↑':'↓'):''}</th>
                    <th>提交供應商</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                ${pageRecords.map(r => `
                <tr>
                    <td style="white-space:nowrap; font-size:12px;">${dateOnly(r.timestamp)}</td>
                    <td>${r.supplier || '-'}</td>
                    <td>${r.item || '-'}</td>
                    <td style="font-weight:bold;">${r.orderNumber ? '#' + r.orderNumber : '-'}</td>
                    <td>${r.customerName || '-'}</td>
                    <td style="font-size:12px; white-space:pre-wrap;">${r.productQty || '-'}</td>
                    <td style="white-space:nowrap;">${dateWithWeekday(r.deliveryDate)}</td>
                    <td><span class="badge ${r.deliveryStatus === '已送達' ? 'badge-delivered' : 'badge-pending'}">${r.deliveryStatus || '待出貨'}</span></td>
                    <td style="white-space:nowrap;">${monthOnly(r.reportMonth) || '<span style="color:#e74c3c; font-size:11px;">未設定</span>'}</td>
                    <td>
                        <label class="toggle-switch">
                            <input type="checkbox" ${r.submitStatus === '已提交' ? 'checked' : ''} onchange="toggleSubmitStatus(${r.rowIndex}, this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="openLedgerEditModal(${r.rowIndex})">編輯</button>
                    </td>
                </tr>`).join('')}
            </tbody>
        </table>
        <div style="display:flex; justify-content:center; align-items:center; margin-top:10px; gap:6px;">
            <button class="btn btn-sm" style="padding:4px 10px;" onclick="ledgerGoPage(${ledgerCurrentPage - 1})" ${ledgerCurrentPage === 1 ? 'disabled' : ''}>上一頁</button>
            <span style="font-size:12px; color:#7f8c8d; padding:0 10px;">${ledgerCurrentPage} / ${totalPages}</span>
            <button class="btn btn-sm" style="padding:4px 10px;" onclick="ledgerGoPage(${ledgerCurrentPage + 1})" ${ledgerCurrentPage >= totalPages ? 'disabled' : ''}>下一頁</button>
        </div>
    `;
}

function ledgerGoPage(page) {
    ledgerCurrentPage = page;
    renderLedgerTable();
}

function setLedgerSort(field) {
    if (ledgerSortField === field) {
        ledgerSortOrder = ledgerSortOrder === 'asc' ? 'desc' : 'asc';
    } else {
        ledgerSortField = field;
        ledgerSortOrder = 'asc';
    }
    renderLedgerTable();
}

async function toggleSubmitStatus(rowIndex, checked) {
    try {
        const value = checked ? '已提交' : '';
        // O欄(col 15): 提交供應商狀態
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 15, value: value });
        const record = recordsData.find(r => r.rowIndex === rowIndex);
        if (record) record.submitStatus = value;
        showToast(checked ? '已標記為已提交' : '已取消提交標記');
    } catch (e) {
        showToast('更新失敗', 'error');
    }
}

function openLedgerEditModal(rowIndex) {
    const record = recordsData.find(r => r.rowIndex === rowIndex);
    if (!record) return;

    const modalHtml = `
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h3>📝 編輯流水帳記錄</h3>
        <div class="form-row">
            <div class="form-group">
                <label>供應商</label>
                <select id="ledger-edit-supplier">
                    ${configData.suppliers.map(s => `<option value="${s}" ${s === record.supplier ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
            </div>
            <div class="form-group">
                <label>項目</label>
                <select id="ledger-edit-item">
                    ${configData.items.map(i => `<option value="${i}" ${i === record.item ? 'selected' : ''}>${i}</option>`).join('')}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>客人姓名</label>
                <input type="text" id="ledger-edit-customer" value="${record.customerName}">
            </div>
            <div class="form-group">
                <label>訂單編號</label>
                <input type="text" id="ledger-edit-order-number" value="${record.orderNumber}">
            </div>
        </div>
        <div class="form-group">
            <label>產品及數量</label>
            <textarea id="ledger-edit-qty">${record.productQty}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>送貨日期</label>
                <input type="date" id="ledger-edit-date" value="${record.deliveryDate}">
            </div>
            <div class="form-group">
                <label>Report 月份</label>
                <input type="month" id="ledger-edit-month" value="${record.reportMonth}">
            </div>
        </div>
        <div class="form-group">
            <label>備註</label>
            <input type="text" id="ledger-edit-remark" value="${record.remark}">
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:20px;">
            <button class="btn btn-danger btn-sm" onclick="deleteLedgerRecord(${rowIndex})">🗑️ 刪除記錄</button>
            <button class="btn btn-primary" onclick="saveLedgerEdit(${rowIndex})">儲存變更</button>
        </div>
    `;
    showModal(modalHtml);
}

async function saveLedgerEdit(rowIndex) {
    const supplier = document.getElementById('ledger-edit-supplier').value;
    const item = document.getElementById('ledger-edit-item').value;
    const customer = document.getElementById('ledger-edit-customer').value.trim();
    const orderNumber = document.getElementById('ledger-edit-order-number').value.trim();
    const qty = document.getElementById('ledger-edit-qty').value.trim();
    const date = document.getElementById('ledger-edit-date').value;
    const month = document.getElementById('ledger-edit-month').value;
    const remark = document.getElementById('ledger-edit-remark').value.trim();

    showLoading();
    try {
        // B(2):供應商, C(3):項目, D(4):產品及數量, E(5):客人, F(6):電話, G(7):訂單編號, H(8):送貨日期, J(10):remark, N(14):report月份
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 2, value: supplier });
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 3, value: item });
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 4, value: qty });
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 5, value: customer });
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 7, value: orderNumber });
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 8, value: date });
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 10, value: remark });
        await gasPost({ action: 'updateCell', sheet: 'Records', row: rowIndex, col: 14, value: month });
        await loadRecords();
        closeModal();
        renderCurrentPage();
        showToast('記錄已更新！');
    } catch (e) {
        showToast('更新失敗', 'error');
    }
    hideLoading();
}

async function deleteLedgerRecord(rowIndex) {
    if (!confirm('確定要刪除此記錄嗎？此操作無法復原。')) return;
    showLoading();
    try {
        await gasPost({ action: 'deleteRow', sheet: 'Records', row: rowIndex });
        await loadRecords();
        closeModal();
        renderCurrentPage();
        showToast('記錄已刪除');
    } catch (e) {
        showToast('刪除失敗', 'error');
    }
    hideLoading();
}

// ============================================================
// HELPERS
// ============================================================
function getVisibleRecords() {
    if (isAdmin()) return [...recordsData];
    // For suppliers, filter by their associated supplier company
    return recordsData.filter(r => r.supplier === currentUser.supplier);
}

// ============================================================
// MODAL
// ============================================================
function showModal(html) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'activeModal';
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
    overlay.innerHTML = `<div class="modal-content">${html}</div>`;
    document.body.appendChild(overlay);
}

function closeModal() {
    const modal = document.getElementById('activeModal');
    if (modal) modal.remove();
}
</script>
</body>
